# Mixed CSV/NPZ example. Supply every configured file before training.
# Adapt paths, channel counts and class counts to the supplied data.
task_dataset:
  ETTh1_forecast_96:
    task_name: long_term_forecast
    dataset: ETTh1
    root_path: dataset/ETT-small
    data_path: ETTh1.csv
    date_column: date
    features: M
    seq_len: 96
    pred_len: 96
    enc_in: 7
    split_borders: [8640, 11520]
    scale: true
    window_stride: 1
  ETTh1_imputation:
    task_name: imputation
    dataset: ETTh1
    root_path: dataset/ETT-small
    data_path: ETTh1.csv
    date_column: date
    features: M
    seq_len: 96
    pred_len: 0
    enc_in: 7
    split_borders: [8640, 11520]
    scale: true
    window_stride: 1
  classification_npz:
    task_name: classification
    dataset: classification_npz
    root_path: dataset/classification
    data_path: classification.npz
    seq_len: 96
    pred_len: 0
    enc_in: 1
    num_class: 2
    scale: true
  anomaly_npz:
    task_name: anomaly_detection
    dataset: anomaly_npz
    root_path: dataset/anomaly
    data_path: anomaly.npz
    seq_len: 96
    pred_len: 0
    enc_in: 55
    scale: true
    window_stride: 1
