# Masked-value reconstruction pretraining on real observations.
# Real CSV imputation example. Paths are relative to the repository root.
# The row borders below are explicit ETTh1 settings.
task_dataset:
  ETTh1_pretrain:
    task_name: imputation
    dataset: ETTh1
    root_path: dataset/ETT-small
    data_path: ETTh1.csv
    date_column: date
    features: M
    seq_len: 96
    pred_len: 0
    enc_in: 7
    split_borders: [8640, 11520]
    scale: true
    window_stride: 1
