# Raw benchmark folders require conversion. See docs/data_formats.md.
# Keys: train, val, test [time, channels], test_labels [test_time] in {0, 1}.
# Set enc_in to the actual channel count of the source series.
task_dataset:
  anomaly_npz:
    task_name: anomaly_detection
    dataset: anomaly_npz
    root_path: dataset/anomaly
    data_path: anomaly.npz
    seq_len: 96
    pred_len: 0
    enc_in: 55
    scale: true
    window_stride: 1
