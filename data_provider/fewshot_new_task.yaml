# New dataset identity registers a new prompt when loading a source checkpoint.
# Match backbone options and reference seq_len to the source run.
# Real CSV forecasting example. Paths are relative to the repository root.
# The row borders below are explicit ETTh2 settings.
task_dataset:
  ETTh2_forecast_96:
    task_name: long_term_forecast
    dataset: ETTh2
    root_path: dataset/ETT-small
    data_path: ETTh2.csv
    date_column: date
    features: M
    seq_len: 96
    pred_len: 96
    enc_in: 7
    split_borders: [8640, 11520]
    scale: true
    window_stride: 1
