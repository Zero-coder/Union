# CSV forecasting configuration using the schema in forecast_csv.yaml.
# Run dataset-free functional checks with python -m unittest discover -s tests -v.
# Paths are relative to the repository root.
# The row borders below are explicit ETTh1 settings.
task_dataset:
  ETTh1_forecast_96:
    task_name: long_term_forecast
    dataset: ETTh1
    root_path: dataset/ETT-small
    data_path: ETTh1.csv
    date_column: date
    features: M
    seq_len: 96
    pred_len: 96
    enc_in: 7
    split_borders: [8640, 11520]
    scale: true
    window_stride: 1
